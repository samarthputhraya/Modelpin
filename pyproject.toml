[project]
name = "modelpin"
version = "0.2.0"
description = "Dependabot for AI models — catch model-migration regressions before they hit production."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Samarth Puthraya" }]
keywords = ["llm", "ai", "agents", "regression-testing", "model-pinning", "evals", "ci", "dependabot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Environment :: Console",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
providers = ["openai>=1.40", "google-genai>=1.0", "anthropic>=0.34"]
# setuptools is NOT redundant with [build-system].requires: that only populates the
# isolated BUILD env. tests/test_packaging_contents.py shells out to the setuptools
# backend at TEST time, and Python 3.12+ venvs no longer bundle it -- without this, a
# documented `pip install -e ".[dev]"` gives 5 errors, not a green suite.
dev = [
  "pytest>=8",
  "ruff>=0.15,<0.16",
  "black>=24,<26",
  "pytest-cov>=5",
  "mypy>=1.11",
  "setuptools>=77",
]

[project.urls]
Homepage = "https://github.com/samarthputhraya/modelpin"
Repository = "https://github.com/samarthputhraya/modelpin"
Issues = "https://github.com/samarthputhraya/modelpin/issues"
Changelog = "https://github.com/samarthputhraya/modelpin/blob/main/CHANGELOG.md"

[project.scripts]
modelpin = "modelpin.cli:main"
mp = "modelpin.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["modelpin*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
