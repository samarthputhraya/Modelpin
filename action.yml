# Modelpin GitHub Action — run `mp check` in CI and post the behavioral diff as a PR comment.
#
# Catch AI model-migration regressions before they ship: replay your scenarios on a new model,
# diff the behavior against a committed baseline, post a PR-style report, and fail the check on a
# real regression. BYO-key (the END USER's API key from repo secrets) — see spec §9.
name: "Modelpin"
description: "Catch AI model-migration regressions in CI before they hit production."
branding:
  icon: "shield"
  color: "yellow"

inputs:
  to:
    description: "check mode: the new model id to test against your baseline (e.g. gpt-5.5). Required in check mode; ignored in watch mode."
    required: false
    default: ""
  mode:
    description: "check (default): replay `to` against the baseline and gate the pull request. watch: read the model-lifecycle registry, and for every model in modelpin.yaml inside its retirement notice window replay the vendor-named successor and open one pull request carrying the verdict. Opt-in: a workflow that never sets this runs exactly what it ran before."
    required: false
    default: "check"
  registry-url:
    description: "watch mode: URL of a data/models.json newer than the one shipped with the Action (fetched with curl, 20 s timeout). Empty (default) uses the copy in this Action's checkout, so no network is needed."
    required: false
    default: ""
  watch-scan:
    description: "watch mode: also read model ids from the repository's source (`mp watch --scan`; walks the tree)."
    required: false
    default: "false"
  watch-max-prs:
    description: "watch mode: at most this many pull requests opened per run (self-throttle)."
    required: false
    default: "3"
  watch-recheck-days:
    description: "watch mode: an open Modelpin pull request updated inside this many days is left alone and nothing is spent."
    required: false
    default: "7"
  fail-on-affected:
    description: "watch mode: fail the job while a declared model is inside its notice window, already retired, or unknown to the registry, so a scheduled run goes red until you migrate."
    required: false
    default: "true"
  from:
    description: "Baseline model id (defaults to the first model in modelpin.yaml)."
    required: false
    default: ""
  provider:
    # MP-128: this list is checked against the adapters by tests/test_advertised_providers.py,
    # so a provider named here that cannot run fails the build rather than a user's CI.
    #
    # Default "" and passed only when set. It defaulted to "openai" and was ALWAYS passed as
    # `--provider`, which overrides `providers:` in modelpin.yaml -- so a Gemini or Claude repo
    # that configured its provider in the file, as `modelpin init` writes it, had its CI
    # replay on OpenAI and fail asking for OPENAI_API_KEY.
    description: "Provider for the candidate replay: openai | google | anthropic | groq | openrouter | together | cerebras. Defaults to `providers:` in modelpin.yaml. `anthropic` reads ANTHROPIC_API_KEY, or runs Claude on Vertex AI when ANTHROPIC_VERTEX_PROJECT_ID is set (Application Default Credentials)."
    required: false
    default: ""
  config:
    description: "Path to modelpin.yaml."
    required: false
    default: "modelpin.yaml"
  scenarios-dir:
    description: "Scenarios directory (defaults to scenarios_dir in modelpin.yaml)."
    required: false
    default: ""
  runs:
    description: "Replays per scenario (defaults to runs in modelpin.yaml; >=5 recommended)."
    required: false
    default: ""
  match:
    description: "Tool-call match mode: strict | unordered | subset | superset."
    required: false
    default: "strict"
  confirm:
    description: "Replay a flagged scenario again and fail only if the regression reproduces (recommended). Set to 'false' to fail on the first sample."
    required: false
    default: "true"
  baseline:
    description: "Record a fresh baseline for `from` before checking (needs the old model still available). Usually you commit the baseline instead."
    required: false
    default: "false"
  comment:
    description: "Post (and update) a sticky PR comment with the report."
    required: false
    default: "true"
  fail-on-regression:
    description: "Fail the job when a regression is detected (the migration gate)."
    required: false
    default: "true"
  github-token:
    description: "Token used to post the PR comment."
    required: false
    default: ${{ github.token }}
  modelpin-spec:
    description: "pip install spec for Modelpin. Override to pin a version or install from git pre-PyPI (e.g. 'modelpin[providers]==0.1.0' or 'modelpin[providers] @ git+https://github.com/OWNER/REPO@TAG')."
    required: false
    default: "modelpin[providers]"
  python-version:
    description: "Python version to set up."
    required: false
    default: "3.12"
  working-directory:
    description: "Directory to run Modelpin in."
    required: false
    default: "."
  store-dir:
    description: "Where baselines live (`mp baseline --store-dir`), relative to working-directory. Both modes read it; watch mode replays successors against the baselines in it."
    required: false
    default: ".modelpin"

outputs:
  verdict-exit-code:
    description: "0 clean, 1 a behavioral regression, 3 the run could not answer - a compared scenario was unmeasurable, the provider rejected one, or nothing could be compared. A scenario with no baseline is disclosed in the report and costs the run its clearance, but does not by itself change the exit code."
    value: ${{ steps.check.outputs.code }}
  report-path:
    description: "Path to the rendered Markdown report."
    value: ${{ steps.check.outputs.report }}
  watch-exit-code:
    description: "watch mode: 0 every declared model is known and active; 1 a declared model is inside its notice window or retired; 3 a declared model is unknown to the registry (not a clearance); 4 nothing declared or the registry could not be read."
    value: ${{ steps.watch.outputs.code }}
  watch-json:
    description: "watch mode: path to the `mp watch --json` document."
    value: ${{ steps.watch.outputs.json }}
  pull-requests:
    description: "watch mode: comma-separated numbers of the pull requests opened or updated this run."
    value: ${{ steps.watch_pr.outputs.prs }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      # MP-244. Pinned to a full commit SHA, never a floating tag: this file runs inside
      # OTHER people's CI with their secrets in scope, and a moved tag is remote code
      # execution that needs no access to this repository (tj-actions/changed-files,
      # March 2025). `release.yml` already held that standard; the file we ask
      # consumers to run did not. [S] 2026-09-11 GitHub API: floating `v6` and `v6.3.0`
      # both dereference to this commit, and v6.3.0 is the newest v6 -- so pinning
      # changes nothing a consumer runs today; it stops it changing underneath them.
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Modelpin
      shell: bash
      env:
        MP_SPEC: ${{ inputs.modelpin-spec }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install "$MP_SPEC"

    - name: Require `to` in check mode
      if: ${{ inputs.mode == 'check' && inputs.to == '' }}
      shell: bash
      run: |
        echo "::error::Modelpin: 'to' is required in check mode (the model to test). Set 'with: to: <model>', or use 'mode: watch'."
        exit 1

    # ----------------------------------------------------------------- watch mode (MP-277)
    # Opt-in by `mode: watch`. Reads the model-lifecycle registry, and for every model the
    # config names that is inside its retirement notice window, replays the vendor-named
    # successor against the committed baseline and opens ONE pull request with the verdict.
    # Nothing here runs unless the consumer's workflow said so; every check-mode step below
    # is gated on `mode == 'check'`, so a workflow that never sets `mode` runs byte-for-byte
    # what it ran before this input existed.
    - name: Resolve the model-lifecycle registry
      id: registry
      if: ${{ inputs.mode == 'watch' }}
      shell: bash
      env:
        MP_REGISTRY_URL: ${{ inputs.registry-url }}
        MP_ACTION_PATH: ${{ github.action_path }}
      run: |
        # The registry ships inside the Action's checkout, pinned by the ref the consumer
        # chose, so the default needs no network. A newer JSON can be fetched from a URL the
        # consumer names; a bad file is refused by the registry's own validation.
        reg="$RUNNER_TEMP/models.json"
        if [ -n "$MP_REGISTRY_URL" ]; then
          curl -fsSL --max-time 20 --retry 2 -o "$reg" "$MP_REGISTRY_URL"
        else
          cp "$MP_ACTION_PATH/data/models.json" "$reg"
        fi
        echo "path=$reg" >> "$GITHUB_OUTPUT"

    - name: Run mp watch
      id: watch
      if: ${{ inputs.mode == 'watch' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MP_CONFIG: ${{ inputs.config }}
        MP_SCAN: ${{ inputs.watch-scan }}
        MP_REGISTRY: ${{ steps.registry.outputs.path }}
        MP_STORE_DIR: ${{ inputs.store-dir }}
      run: |
        set +e
        args=(--config "$MP_CONFIG" --registry "$MP_REGISTRY" --store-dir "$MP_STORE_DIR")
        [ "$MP_SCAN" = "true" ] && args+=(--scan)
        mp watch "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
        json="$RUNNER_TEMP/watch.json"
        mp watch "${args[@]}" --json > "$json"
        code=$?
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "json=$json" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Check successors and open pull requests
      id: watch_pr
      # Only when a declared model is inside its notice window or retired (exit 1). An unknown
      # model (exit 3) is not a regression and opens nothing: that is the steady state for an
      # id served by an OpenAI-compatible host, and a pull request on it would be unsolicited.
      if: ${{ inputs.mode == 'watch' && steps.watch.outputs.code == '1' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MP_ACTION_PATH: ${{ github.action_path }}
        MP_WATCH_JSON: ${{ steps.watch.outputs.json }}
        MP_CONFIG: ${{ inputs.config }}
        MP_PROVIDER: ${{ inputs.provider }}
        MP_RUNS: ${{ inputs.runs }}
        MP_MATCH: ${{ inputs.match }}
        MP_MAX_PRS: ${{ inputs.watch-max-prs }}
        MP_RECHECK_DAYS: ${{ inputs.watch-recheck-days }}
        MP_STORE_DIR: ${{ inputs.store-dir }}
      run: |
        args=(--watch-json "$MP_WATCH_JSON" --config "$MP_CONFIG" --max-prs "$MP_MAX_PRS" --recheck-days "$MP_RECHECK_DAYS" --store-dir "$MP_STORE_DIR")
        [ -n "$MP_PROVIDER" ] && args+=(--provider "$MP_PROVIDER")
        [ -n "$MP_RUNS" ] && args+=(--runs "$MP_RUNS")
        [ -n "$MP_MATCH" ] && args+=(--match "$MP_MATCH")
        python "$MP_ACTION_PATH/actions/watch_pr.py" "${args[@]}"

    - name: Fail while a declared model is retiring or unknown
      id: watch_fail
      if: ${{ inputs.mode == 'watch' && inputs.fail-on-affected == 'true' && steps.watch.outputs.code != '0' }}
      shell: bash
      env:
        MP_WATCH_CODE: ${{ steps.watch.outputs.code }}
        MP_PRS: ${{ steps.watch_pr.outputs.prs }}
      run: |
        # Red until migrated is the point of a scheduled watch. Every branch states what
        # was measured and nothing more (ADR-0035): an unknown model is not a verdict.
        if [ "$MP_WATCH_CODE" = "1" ]; then
          echo "::error::Modelpin: a model this repository depends on is inside its retirement notice window or already retired. See the step summary; pull request(s): ${MP_PRS:-none opened}."
        elif [ "$MP_WATCH_CODE" = "3" ]; then
          echo "::error::Modelpin: the registry has no entry for a model this repository depends on. Unknown is not a clearance; see the step summary."
        elif [ "$MP_WATCH_CODE" = "4" ]; then
          echo "::error::Modelpin could not RUN mp watch: nothing declared in modelpin.yaml, or the registry could not be read. See this step's log."
        else
          echo "::error::Modelpin: mp watch exited with an unexpected code $MP_WATCH_CODE. This is not a verdict. See this step's log."
        fi
        exit 1

    # ----------------------------------------------------------------- check mode (default)
    - name: Record baseline (optional)
      if: ${{ inputs.mode == 'check' && inputs.baseline == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # Pass every caller-controlled input as data through the environment — never
        # interpolate it into the shell script text (prevents Actions script injection).
        MP_FROM: ${{ inputs.from }}
        MP_PROVIDER: ${{ inputs.provider }}
        MP_CONFIG: ${{ inputs.config }}
        MP_SCENARIOS_DIR: ${{ inputs.scenarios-dir }}
        MP_RUNS: ${{ inputs.runs }}
        MP_STORE_DIR: ${{ inputs.store-dir }}
      run: |
        args=(--config "$MP_CONFIG" --store-dir "$MP_STORE_DIR")
        [ -n "$MP_PROVIDER" ] && args+=(--provider "$MP_PROVIDER")
        [ -n "$MP_FROM" ] && args+=(--model "$MP_FROM")
        [ -n "$MP_SCENARIOS_DIR" ] && args+=(--scenarios-dir "$MP_SCENARIOS_DIR")
        [ -n "$MP_RUNS" ] && args+=(--runs "$MP_RUNS")
        mp baseline "${args[@]}"

    - name: Run mp check
      id: check
      if: ${{ inputs.mode == 'check' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # Caller inputs flow as env data, never as inline script text (script-injection safe).
        MP_TO: ${{ inputs.to }}
        MP_FROM: ${{ inputs.from }}
        MP_PROVIDER: ${{ inputs.provider }}
        MP_MATCH: ${{ inputs.match }}
        MP_CONFIG: ${{ inputs.config }}
        MP_SCENARIOS_DIR: ${{ inputs.scenarios-dir }}
        MP_RUNS: ${{ inputs.runs }}
        MP_WORKDIR: ${{ inputs.working-directory }}
        MP_CONFIRM: ${{ inputs.confirm }}
        MP_STORE_DIR: ${{ inputs.store-dir }}
      run: |
        set +e
        args=(--to "$MP_TO" --match "$MP_MATCH" --config "$MP_CONFIG" --store-dir "$MP_STORE_DIR")
        [ -n "$MP_PROVIDER" ] && args+=(--provider "$MP_PROVIDER")
        [ "$MP_CONFIRM" = "false" ] && args+=(--no-confirm)
        [ -n "$MP_FROM" ] && args+=(--from "$MP_FROM")
        [ -n "$MP_SCENARIOS_DIR" ] && args+=(--scenarios-dir "$MP_SCENARIOS_DIR")
        [ -n "$MP_RUNS" ] && args+=(--runs "$MP_RUNS")
        mp check "${args[@]}"
        code=$?
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "report=$MP_WORKDIR/$MP_STORE_DIR/last-report.md" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Post PR comment
      if: ${{ inputs.mode == 'check' && inputs.comment == 'true' && github.event.pull_request.number }}
      # A comment that cannot be posted (a pull request from a fork gets a read-only token)
      # must not turn the job red by itself: the verdict is gated by the step below, and the
      # report is still in the job log and at `report-path`.
      continue-on-error: true
      # MP-244, same reason as setup-python above. [S] 2026-09-11 GitHub API: `v9` and
      # `v9.0.0` are two annotated tag objects that both dereference to this one commit,
      # and they are the only v9 tags -- so this is exactly what `@v9` resolved to.
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      env:
        REPORT_PATH: ${{ steps.check.outputs.report }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const marker = '<!-- modelpin-report -->';
          const path = process.env.REPORT_PATH;
          let body;
          if (fs.existsSync(path)) {
            body = `${marker}\n${fs.readFileSync(path, 'utf8')}`;
          } else {
            body = `${marker}\n**Modelpin**: the check did not produce a report (it may have failed before diffing). See the job log.`;
          }
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          // Paginated: a busy pull request has more than one page of comments, and missing
          // the marker on page 2 would post a duplicate report on every run.
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Fail on regression or an unmeasurable run
      if: ${{ inputs.mode == 'check' && inputs.fail-on-regression == 'true' && steps.check.outputs.code != '0' }}
      shell: bash
      env:
        MP_TO: ${{ inputs.to }}
        MP_CODE: ${{ steps.check.outputs.code }}
      run: |
        # Every branch here asserts something about a real person's model migration, in
        # public, on their PR. It must never assert a measurement that was not made.
        #
        # Exit 3 means we could NOT measure, which is not the same claim as "it regressed".
        # Saying "regression" there would put a false statement in the PR. See ADR-0018.
        #
        # Exit 4 means we never produced a verdict AT ALL -- missing key, bad flag, unreadable
        # config. [M] 2026-09-06 this used to be exit 1 and fell to the `else` below, so a
        # contributor who had not yet added OPENAI_API_KEY to repository secrets was told, in
        # a GitHub error annotation, that Modelpin had detected a behavioral regression in
        # their migration. No replay ran; nothing was compared. See ADR-0035.
        #
        # The final `else` reports the code instead of guessing at it: a code we do not
        # recognise is exactly the case where inventing a meaning is most likely to be wrong.
        if [ "$MP_CODE" = "3" ]; then
          echo "::error::Modelpin could not measure at least one scenario migrating to '$MP_TO' - it is NOT cleared. See the PR comment / report."
        elif [ "$MP_CODE" = "4" ]; then
          echo "::error::Modelpin could not RUN for '$MP_TO' - a setup or configuration problem (often a missing API-key secret). No verdict was produced and nothing was measured. See this step's log for the error."
        elif [ "$MP_CODE" = "1" ]; then
          echo "::error::Modelpin detected a behavioral regression migrating to '$MP_TO'. See the PR comment / report."
        else
          echo "::error::Modelpin exited with an unexpected code $MP_CODE migrating to '$MP_TO'. This is not a verdict. See this step's log."
        fi
        exit 1
